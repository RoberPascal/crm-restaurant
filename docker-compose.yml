# =====================================================
# Docker Compose — Ptica Sinica Family (полная оркестрация)
# =====================================================
# Запуск: docker compose up -d
# Логи:   docker compose logs -f [service_name]
# Стоп:   docker compose down
# =====================================================

services:
  # =====================================================
  # ИНФРАСТРУКТУРА
  # =====================================================

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =====================================================
  # BACKEND (CRM API)
  # =====================================================

  backend:
    build:
      context: ./crm-dev/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./crm-dev/backend/.env
    environment:
      # Переопределяем для Docker network
      CRM_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/app
      CRM_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # =====================================================
  # FRONTENDS
  # =====================================================

  crm-frontend:
    build:
      context: ./crm-dev/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_CRM_API_URL:-http://backend:8000}
        NEXT_PUBLIC_CRM_API_URL: ${NEXT_PUBLIC_CRM_API_URL:-http://backend:8000}
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-https://strapi.pticasinicafamily.ru}
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - app-network

  app-frontend:
    build:
      context: ./app-dev/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_APP_API_URL:-http://backend:8000}
        NEXT_PUBLIC_CRM_API_URL: ${NEXT_PUBLIC_CRM_API_URL:-http://backend:8000}
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-https://strapi.pticasinicafamily.ru}
        NEXT_PUBLIC_STRAPI_BASE_URL: ${NEXT_PUBLIC_STRAPI_BASE_URL:-https://strapi.pticasinicafamily.ru}
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
        NEXT_PUBLIC_GEOAPIFY_API_KEY: ${NEXT_PUBLIC_GEOAPIFY_API_KEY:-}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

  # =====================================================
  # TELEGRAM BOTS
  # =====================================================

  telegram-bot-public:
    build:
      context: ./telegram-bot-public
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./telegram-bot-public/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  telegram-bot-staff:
    build:
      context: ./telegram-bot-staff
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./telegram-bot-staff/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # =====================================================
  # STRAPI CMS
  # =====================================================

  strapi:
    build:
      context: ./strapi-dev
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./strapi-dev/.env
    ports:
      - "1339:1339"
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

# =====================================================
# VOLUMES & NETWORKS
# =====================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  strapi_uploads:
    driver: local

networks:
  app-network:
    driver: bridge
